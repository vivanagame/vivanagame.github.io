<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Tetris - Vivana-Retro</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- EmulatorJS Core CSS (if you were using it) -->
    <!-- <link rel="stylesheet" href="https://cdn.emulatorjs.org/stable/data/emulator.css"> -->

    <!-- CUSTOM STYLES TO OVERRIDE EMULATORJS BUTTONS -->
    <style>
        /* 1. Make the EmulatorJS Menu Bar highly visible */
        .ejs_menu_bar {
            background: rgba(5, 5, 8, 0.9) !important; /* Dark background */
            border: 1px solid #00ffff !important; /* Neon Cyan border */
            border-radius: 8px 8px 0 0 !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important;
        }

        /* 2. Make the icons inside the menu bar bigger, neon, and glowing */
        .ejs_menu_bar svg {
            fill: #00ffff !important; /* Neon Cyan color */
            width: 28px !important;   /* Make them bigger */
            height: 28px !important;
            filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.8));
            transition: transform 0.2s, filter 0.2s !important;
        }

        /* 3. Add a hover effect to the buttons */
        .ejs_menu_bar div:hover svg {
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px #00ffff);
        }

        /* 4. Style the Mobile Virtual Gamepad buttons (if applicable) */
        .ejs_virtual_gamepad button, 
        .ejs_virtual_gamepad .ejs_dpad_main, 
        .ejs_virtual_gamepad .ejs_dpad_main div {
            opacity: 0.7 !important; /* Make buttons slightly transparent so they don't block the game */
            filter: drop-shadow(0 0 5px #00ffff) !important;
        }

        /* 5. Game Container to ensure it's responsive and stays in the center */
        .game-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            aspect-ratio: 4 / 3; /* Classic retro aspect ratio */
            background: #000;
            border: 2px solid #00ffff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* Responsive tweaks for mobile */
        @media (max-width: 768px) {
            .game-wrapper {
                aspect-ratio: 16 / 9; /* Adjust for mobile landscape if needed */
                border-radius: 0;
                border-left: none;
                border-right: none;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND VIDEO -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="background.webm" type="video/webm">
    </video>

    <!-- LEFT STICKY MENU -->
    <nav class="side-menu left">
        <a href="index.html" class="menu-item">Home</a>
        <a href="library.html" class="menu-item active">Library</a>
        <a href="submit.html" class="menu-item">Community</a>
    </nav>

    <!-- RIGHT STICKY MENU (Socials) -->
    <nav class="side-menu right">
        <!-- ... Your Social SVG links ... -->
    </nav>

    <!-- MAIN GAME SECTION -->
    <main class="hero" style="padding: 20px;">
        
        <!-- Game Container -->
        <div class="game-wrapper">
            <!-- EmulatorJS injects the game canvas here -->
            <div id="game"></div>
        </div>

    </main>

    <!-- EMULATOR JS SCRIPT -->
    <script>
        // Note: Change the paths to where you actually host your EmulatorJS data files
        EJS_player = "#game";
        EJS_core = "nes"; // Change to "segaMD", "snes", etc.
        EJS_gameUrl = "roms/tetris.nes"; // The path to your ROM file
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/"; 
        
        // Optional: Force virtual gamepad on mobile
        EJS_Buttons = {
            playPause: true,
            restart: true,
            saveState: true,
            loadState: true,
            fullscreen: true
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
