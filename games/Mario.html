<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Super Mario Bros 3</title>
    <style>
        /* =========================================
           BASE LAYOUT & RESPONSIVENESS
           ========================================= */
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
        }
        #wrapper { position: relative; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
        #game { width: 100%; height: 100%; }
        
        /* Ensure the canvas fits the screen perfectly without stretching */
        #game canvas { width: 100% !important; height: 100% !important; object-fit: contain; display: block; }

        /* =========================================
           CUSTOM EMULATORJS UI OVERRIDES 
           (Makes the native buttons glow and stand out)
           ========================================= */
        
        /* 1. Style the Native EmulatorJS Start Button */
        .ejs_start_button {
            background: rgba(5, 5, 8, 0.9) !important;
            border: 2px solid #00ffff !important;
            color: #00ffff !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5) !important;
            border-radius: 8px !important;
            font-family: sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            padding: 10px 20px !important;
            cursor: pointer;
        }

        /* 2. Make the Native EmulatorJS Menu Bar (bottom bar) highly visible */
        .ejs_menu_bar {
            background: rgba(5, 5, 8, 0.9) !important;
            border: 1px solid #00ffff !important;
            border-radius: 8px 8px 0 0 !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important;
        }

        /* 3. Make the icons inside the menu bar bigger, neon cyan, and glowing */
        .ejs_menu_bar svg {
            fill: #00ffff !important;
            width: 28px !important;
            height: 28px !important;
            filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.8));
            transition: transform 0.2s, filter 0.2s !important;
        }

        /* 4. Add a hover effect to the icons */
        .ejs_menu_bar div:hover svg {
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px #00ffff);
        }

        /* 5. Style the Native Mobile Virtual Gamepad buttons (D-Pad & Actions) */
        .ejs_virtual_gamepad button, 
        .ejs_virtual_gamepad .ejs_dpad_main, 
        .ejs_virtual_gamepad .ejs_dpad_main div {
            opacity: 0.8 !important; 
            filter: drop-shadow(0 0 5px #00ffff) !important;
            border: 1px solid rgba(0, 255, 255, 0.5) !important;
            background: rgba(0, 255, 255, 0.1) !important;
        }
        
        .ejs_virtual_gamepad button:active,
        .ejs_virtual_gamepad .ejs_dpad_main:active,
        .ejs_virtual_gamepad .ejs_dpad_main div:active {
            background: rgba(0, 255, 255, 0.4) !important;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <!-- EmulatorJS will inject the game and its native UI here -->
        <div id="game"></div>
    </div>

    <script>
        // EmulatorJS Configuration
        window.EJS_player        = '#game';
        window.EJS_gameUrl       = './data/roms/nes/smb3.nes';
        window.EJS_core          = 'nes';
        window.EJS_pathtodata    = './data/';
        
        // Auto-start the game
        window.EJS_startOnLoaded = true; 
    </script>

    <!-- Load EmulatorJS -->
    <script src="./data/loader.js"></script>
</body>
</html>
